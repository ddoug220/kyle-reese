name: Feature request
description: Propose a metric rule, report format, safe transformation, or integration.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cannot be done today, and who encounters the problem?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Concrete example
      description: Show a small source or command example when possible.
      render: javascript
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior, not an implementation preference.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Compatibility or safety considerations
      description: Note changed metric results, source writes, or migration needs.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for the same request.
          required: true
