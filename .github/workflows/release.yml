name: Release package

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify package
        run: npm run verify
      - name: Build npm tarball
        run: npm pack
      - name: Attach tarball to release
        run: gh release upload "${{ github.event.release.tag_name }}" kyle-reese-*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
